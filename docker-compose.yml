services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Without a fixed secret every restart signs everyone out.
      - BFX_SECRET_KEY=${BFX_SECRET_KEY:-zmen-me-v-env-souboru}
      - BFX_DATA_DIR=/data
      # Optional: enables the written commentary in the AI analysis layer.
      # Everything else there works without it.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./backend/app:/app/app
      - bfx-data:/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend

volumes:
  bfx-data:
